name: CI
on:
  pull_request:
  push:
    branches: [dev-v2, dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          {
            POSTGRES_USER: eventis,
            POSTGRES_PASSWORD: eventis,
            POSTGRES_DB: eventis_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eventis" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://eventis:eventis@localhost:5432/eventis_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eventis-Rw/Eventis-contracts
          ref: 64fe98b6a49276ad14e112d1ab423a0171482265
          path: .shared
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Register shared packages
        run: |
          for package in contracts tsconfig eslint-config; do
            (cd .shared/packages/$package && bun link)
          done
      - name: Install and build shared contracts
        run: |
          bun install
          bun node_modules/typescript/bin/tsc -p .shared/packages/contracts/tsconfig.build.json
      - name: Validate schema and migrate a clean database
        run: |
          bunx --bun prisma generate
          bunx --bun prisma validate
          bunx --bun prisma migrate deploy
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test src
      - name: Money guard
        run: bun run guard:money
      - name: Build
        run: bun run build
      - name: Build VPS source bundle
        run: python3 scripts/package-vps.py --output /tmp/eventis-release --contracts-root .shared
      - uses: actions/upload-artifact@v4
        with:
          name: vps-release-${{ github.sha }}
          path: /tmp/eventis-release/app.tar.gz
          retention-days: 7
  legacy-static:
    name: Existing lint and boundary debt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eventis-Rw/Eventis-contracts
          ref: 64fe98b6a49276ad14e112d1ab423a0171482265
          path: .shared
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: |
          for package in contracts tsconfig eslint-config; do (cd .shared/packages/$package && bun link); done
          bun install
          bun node_modules/typescript/bin/tsc -p .shared/packages/contracts/tsconfig.build.json
          bunx --bun prisma generate
          bun run lint
          bun run depcruise

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-v2'
    concurrency:
      group: eventis-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: vps-dev
      url: https://eventis-api.brother-1.hubfly.app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vps-release-${{ github.sha }}
          path: release
      - name: Deploy tested source bundle
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eventis-deploy
          chmod 600 ~/.ssh/eventis-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/eventis-deploy -p 24596 ubuntu@38.58.176.137 "deploy $RELEASE_SHA" < release/app.tar.gz
      - name: Verify public gateway
        run: curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://eventis-api.brother-1.hubfly.app/readyz
